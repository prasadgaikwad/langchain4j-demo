spring.application.name=langchain4j-demo
langchain4j.openai.client.timeout=60s

app.cli.enabled=true
app.chat.provider=openai
app.chat.model-name=gpt-4o-mini
app.models.anthropic-model=claude-haiku-4-5-20251001
app.models.gemini-model=gemini-2.5-flash
app.models.ollama-model=llama3.2
app.ollama.base-url=http://localhost:11434
app.memory.max-messages=10
app.memory.max-tokens=2000
app.stateful.max-context-messages=20
app.embedding.model-name=text-embedding-3-small
app.embedding.store-path=embedding-store.json
app.embedding.max-results=5
app.rag.max-results=5
app.image.model-name=gpt-image-1
app.stt.model-name=whisper-1
app.document.splitter=recursive
app.document.max-chunk-size=200
app.document.max-overlap=20

# Database-backed conversation history (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Actuator monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=langchain4j-demo
info.app.description=LangChain4j feature demo: memory, RAG, agents, prompting, streaming, WebSocket, DB
info.app.java-version=${java.version}

# Swagger UI / OpenAPI (springdoc)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
